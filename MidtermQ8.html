<!DOCTYPE html>
<html>
<head>
    <style>
        table {
            border: 2px solid black;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        th {
            background-color: lightgray;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th>Name</th>
        <th>Age</th>
    </tr>
    <tr>
        <td>Jose</td>
        <td>20</td>
    </tr>
</table>

</body>
</html>
