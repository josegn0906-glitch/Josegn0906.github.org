<!DOCTYPE html>
<html>
<head>
<style>

.box1 {
    border: 5px solid black;
    padding: 5px;
    margin-bottom: 20px;
}

.box2 {
    border: 3px solid black;
    padding: 5px;
    margin-bottom: 20px;
}

.box3 {
    border: 3px dotted black;
    padding: 5px;
    margin-bottom: 20px;
}

.box4 {
    border: 7px dotted black;
    padding: 5px;
    margin-bottom: 20px;
}

.box5 {
    border: 10px double black;
    padding: 5px;
    margin-bottom: 20px;
}

.box6 {
    border: 4px double black;
    padding: 5px;
}

</style>
</head>

<body>

<div class="box1">Some text.</div>

<div class="box2">Some text.</div>

<div class="box3">Some text.</div>

<div class="box4">Some text.</div>

<div class="box5">Some text.</div>

<div class="box6">Some text.</div>

</body>
</html>
